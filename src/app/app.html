<div class="app-shell">
	<app-toast></app-toast>

	@if (!isAdminRoute()) {
		<header class="site-header">
			<div class="layout-container">
				<a class="brand" [routerLink]="['/']">
					<span class="brand-main">{{ title() }}</span>
					<span class="brand-sub">PERSONAL WEBSITE</span>
				</a>
			</div>
			<nav class="header-nav" aria-label="主要導覽">
				<a [routerLink]="['/']">回首頁</a>
				<a [routerLink]="['/resume']">履歷</a>
			</nav>
			<button class="theme-toggle" 
					[class.is-dark]="isDarkMode()" 
					type="button" 
					(click)="toggleTheme()" 
					[attr.aria-label]="isDarkMode() ? '切換至亮色模式' : '切換至暗色模式'">
				
				<!-- 圖示動畫區塊 -->
				<div class="icon-wrapper" aria-hidden="true">
					<span class="icon-sun">☀️</span>
					<span class="icon-moon">🌙</span>
				</div>
				
				<!-- 文字區塊 -->
				<span class="text-wrapper">{{ isDarkMode() ? '亮色' : '暗色' }}</span>
			</button>
		</header>
	}

	<main class="page-content" [class.with-site-header]="!isAdminRoute()">
		<router-outlet></router-outlet>
	</main>

	@if (!isAdminRoute()) {
		<footer class="site-footer">
			<div class="layout-container">
				<small>Copyright {{ currentYear }} {{ title() }}. Built with care.</small>
			</div>
		</footer>
	}
</div>
