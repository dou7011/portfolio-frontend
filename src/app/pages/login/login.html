<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <h2>系統管理員登入</h2>
    </div>

    <div class="login-body">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">電子郵件</label>
          <input id="email" type="text" formControlName="email" placeholder="請輸入電子郵件" autocomplete="username">
          @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
            <span class="field-error">請輸入電子郵件</span>
          }
        </div>

        <div class="form-group">
          <label for="password">密碼</label>
          <input id="password" type="password" formControlName="password" placeholder="請輸入密碼" autocomplete="current-password">
          @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
            <span class="field-error">請輸入密碼</span>
          }
        </div>

        @if (errorMessage) {
          <div class="error-msg">{{ errorMessage }}</div>
        }

        <button type="submit" [disabled]="loginForm.invalid || isLoading" class="submit-btn">
          {{ isLoading ? '登入中...' : '登入' }}
        </button>
      </form>
    </div>
  </div>
</div>
