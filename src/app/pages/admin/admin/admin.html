<div class="admin-wrapper">
  <aside class="sidebar">
    <div class="brand">
      <h2>Admin Panel</h2>
      <p>管理員控制中心</p>
    </div>
    
    <nav class="menu">
      <ul>
        @for (item of menuItems; track item.path) {
          <li>
            @if (item.children) {
              <div class="nav-group" [class.expanded]="isMenuExpanded(item.path)">
                <button
                  class="group-label"
                  type="button"
                  [attr.aria-expanded]="isMenuExpanded(item.path)"
                  (click)="toggleMenu(item.path)"
                >
                  <span>{{ item.name }}</span>
                  <span class="group-chevron" aria-hidden="true">
                    <svg class="chevron" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                  </span>
                </button>
                <div class="submenu-outer">
                  <ul class="submenu">
                    @for (child of item.children; track child.path) {
                      <li>
                        <a [routerLink]="['/admin', child.path]" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                          {{ child.name }}
                        </a>
                      </li>
                    }
                  </ul>
                </div>
              </div>
            } @else {
              <a [routerLink]="['/admin', item.path]" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
                {{ item.name }}
              </a>
            }
          </li>
        }
      </ul>
    </nav>

    <div class="logout-box">
      <button class="theme-toggle-admin" type="button" (click)="toggleTheme()" [attr.aria-label]="isDarkMode() ? '切換亮色模式' : '切換暗色模式'">
        <span aria-hidden="true">{{ isDarkMode() ? '☀' : '◐' }}</span>
        {{ isDarkMode() ? '亮色' : '暗色' }}
      </button>
      <div class="footer-links">
        <a class="home-btn" [routerLink]="['/']">首頁</a>
        <button class="logout-btn" (click)="onLogout()">登出</button>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>

@if (isLogoutModalOpen) {
  <div class="modal-backdrop" (click)="closeLogoutModal()">
    <section class="logout-modal" (click)="$event.stopPropagation()" aria-modal="true" role="dialog" aria-label="登出確認">
      <h3>確認登出</h3>
      <p>你確定要離開管理系統嗎？</p>

      <div class="modal-actions">
        <button class="modal-btn cancel" type="button" (click)="closeLogoutModal()">取消</button>
        <button class="modal-btn confirm" type="button" (click)="confirmLogout()">確認登出</button>
      </div>
    </section>
  </div>
}
