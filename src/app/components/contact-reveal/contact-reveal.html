<span class="reserve" aria-hidden="true">{{ email() }}</span>

<div class="shell" [class.is-open]="open()">
  <a
    class="trigger"
    [href]="'mailto:' + email()"
    [attr.aria-label]="label()"
    [attr.aria-controls]="panelId"
    [attr.aria-expanded]="open()"
    (click)="onTrigger($event)">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <rect x="3" y="5" width="18" height="14" rx="2" />
      <path d="m4 7 8 6 8-6" />
    </svg>
  </a>

  <div class="panel" [id]="panelId">
    <div class="panel-inner">
      <div class="panel-content">
        <a class="email" [href]="'mailto:' + email()" title="寄送 Email">{{ email() }}</a>
        <button
          type="button"
          class="copy-btn"
          [class.is-copied]="copied()"
          [attr.aria-label]="copied() ? '已複製 Email' : '複製 Email'"
          (click)="copy()">
          <svg class="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="9" width="11" height="11" rx="2" />
            <path d="M5 15V6a2 2 0 0 1 2-2h9" />
          </svg>
          <svg class="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m5 12.5 4.5 4.5L19 7.5" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>

<span class="toast" [class.is-visible]="copied()" role="status" aria-live="polite">{{ copied() ? '已複製' : '' }}</span>
