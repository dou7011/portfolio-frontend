<div class="loading-indicator" role="status" aria-live="polite">
  <span class="loading-emblem" aria-hidden="true">
    <span class="loading-orbit"><span class="loading-orbit-dot"></span></span>
    <span class="loading-ring"></span>
    <span class="loading-ring-inner"></span>
    <span class="loading-core"></span>
  </span>
  <span class="loading-label">{{ label() }}</span>
  <span class="loading-caption"><span class="loading-caption-dot"></span>LOADING</span>
</div>
